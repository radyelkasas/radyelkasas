<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rady Elkasas — Full-Stack Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f8fc"/><stop offset="1" stop-color="#eef1fb"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a4cf5"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45"><stop offset="0" stop-color="#6a4cf5" stop-opacity="0.35"/><stop offset="1" stop-color="#6a4cf5" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dfe4f3" stroke-width="1"/></pattern>
  <clipPath id="r"><rect width="1200" height="300" rx="20"/></clipPath>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .name { font-size: 54px; font-weight: 800; fill: #0d1530; letter-spacing: -1px; }
    .role { font-size: 24px; font-weight: 600; fill: url(#accent); }
    .tag { font-size: 17px; fill: #55607d; }
    .chip { font-size: 14px; font-weight: 600; fill: #0d1530; }
    .code { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; fill: #55607d; }
    .kw { fill: #6a4cf5; } .str { fill: #0891b2; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .cursor, .float { animation: none; } }
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <text x="64" y="100" class="name">Rady Elkasas</text>
  <text x="66" y="142" class="role">Full-Stack Developer · AI SaaS &amp; Developer Tools</text>
  <text x="66" y="182" class="tag">I build Arabic-first, production-grade web products — from idea to deploy.</text>
  <g transform="translate(64 228)"><rect width="71" height="30" rx="15" fill="#ffffff" stroke="#d5dbee"/><text x="35.5" y="20" text-anchor="middle" class="chip">React</text></g><g transform="translate(145 228)"><rect width="88.19999999999999" height="30" rx="15" fill="#ffffff" stroke="#d5dbee"/><text x="44.099999999999994" y="20" text-anchor="middle" class="chip">Next.js</text></g><g transform="translate(243.2 228)"><rect width="114" height="30" rx="15" fill="#ffffff" stroke="#d5dbee"/><text x="57" y="20" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(367.2 228)"><rect width="88.19999999999999" height="30" rx="15" fill="#ffffff" stroke="#d5dbee"/><text x="44.099999999999994" y="20" text-anchor="middle" class="chip">Node.js</text></g><g transform="translate(465.4 228)"><rect width="114" height="30" rx="15" fill="#ffffff" stroke="#d5dbee"/><text x="57" y="20" text-anchor="middle" class="chip">PostgreSQL</text></g><g transform="translate(589.4 228)"><rect width="105.39999999999999" height="30" rx="15" fill="#ffffff" stroke="#d5dbee"/><text x="52.699999999999996" y="20" text-anchor="middle" class="chip">AI Agents</text></g>
  <g transform="translate(842 64)"><g class="float">
    <rect width="300" height="172" rx="14" fill="#ffffff" stroke="#d5dbee"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/><circle cx="40" cy="20" r="5" fill="#febc2e"/><circle cx="58" cy="20" r="5" fill="#28c840"/>
    <text x="20" y="60" class="code"><tspan class="kw">const</tspan> rady = {</text>
    <text x="36" y="84" class="code">based: <tspan class="str">'Giza, Egypt'</tspan>,</text>
    <text x="36" y="108" class="code">ships: <tspan class="str">'SaaS + LMS'</tspan>,</text>
    <text x="36" y="132" class="code">open: <tspan class="str">'freelance'</tspan>,</text>
    <text x="20" y="156" class="code">}<tspan class="cursor" fill="#0891b2">▍</tspan></text>
  </g></g>
</g>
</svg>
